  <style>
    @font-face {
      src: local('Consolas'), local('Consolas Bold');
      font-family: 'ConsolasFallback';
      font-display: swap;
      -webkit-size-adjust: 109%;
      size-adjust: 109%;
    }
    .window-frame {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.5px;
      rx: 15px;
    }
    .top-bar-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #8b949e;
    }
    .terminal-bg {
      fill: #161b22;
      stroke: #21262d;
      stroke-width: 1px;
      rx: 10px;
    }
    .ascii-text {
      font-family: Consolas, "Courier New", Menlo, Monaco, monospace;
      font-size: 7.0px;
      fill: #c9d1d9;
      white-space: pre;
    }
    .info-text {
      font-family: 'ConsolasFallback', Consolas, monospace;
      font-size: 16px;
      white-space: pre;
    }
    .key { fill: #ffa657; }
    .value { fill: #a5d6ff; }
    .addColor { fill: #3fb950; }
    .delColor { fill: #f85149; }
    .cc { fill: #616e7f; }
    text, tspan { white-space: pre; }
  </style>

